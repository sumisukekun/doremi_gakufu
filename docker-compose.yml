services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - FREE_PER_DAY=${FREE_PER_DAY:-3}
  # HTTPS（マイク録音はHTTPSでないと動かないため必須）。証明書は自動取得
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${DOMAIN} --to app:8000
    volumes: [caddy_data:/data]
    depends_on: [app]
volumes:
  caddy_data:
